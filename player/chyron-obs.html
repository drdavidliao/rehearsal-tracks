<!doctype html>
<!-- The chyron for OBS, opened as a local file so that it's there even while the player isn't. It asks the player every
     half second; once the player answers it shows the chyron, and when the player restarts it loads the chyron afresh, so a
     rebuilt chyron.html shows without touching OBS.
     Options are chyron.html's (style=broadcast, layout=stack, accent=..., scale=...), after ? or # in the address, plus
     port=8766 for a player on another port. -->
<html><head><meta charset="utf-8"><title>Rehearsal chyron (OBS)</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
</style></head>
<body>
<iframe id="f" allowtransparency="true"></iframe>
<script>
const opts = new URLSearchParams(location.search || location.hash.slice(1));
const base = `http://localhost:${parseInt(opts.get('port')) || 8766}/`;
opts.delete('port');
const frame = document.getElementById('f');
let run = null;
async function probe() {
  try {
    const r = await fetch(base + 'state', { cache: 'no-store' });
    const s = await r.json();
    const id = String(s.started ?? 'up');
    // first answer, or a new run of the player: load its chyron (the v= keeps a cached copy out)
    if (id !== run) {
      run = id;
      opts.set('v', Date.now());
      frame.src = base + '?' + opts.toString();
    }
  } catch (e) {
    // not running: the chyron hides itself, and this keeps asking
  }
  setTimeout(probe, 500);
}
probe();
</script>
</body></html>
