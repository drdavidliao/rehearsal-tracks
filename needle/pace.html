<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rehearsal pace</title>
<style>
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--track:#efeee9;--seg:#c9dcf0;--seg2:#e3ecf6;--done:#1D9E75;--over:#c2410c;--cur:#185FA5}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--track:#2c2c2a;--seg:#24476b;--seg2:#1d3550;--done:#5DCAA5;--over:#f08a4b;--cur:#85B7EB}}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,sans-serif}
.sub{color:var(--muted);font-size:12px;margin:0 0 14px}
#what{font-size:15px;color:var(--ink2);margin:0}
#by{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;margin:0;line-height:1.1}
#left{font-size:20px;font-weight:500;margin:2px 0 0;font-variant-numeric:tabular-nums}
#left.ok{color:var(--done)}#left.over{color:var(--over)}
#next{color:var(--ink2);margin:4px 0 0}
#bar{position:relative;height:22px;background:var(--track);border-radius:4px;margin:18px 0 4px;overflow:hidden}
#bar div{position:absolute;top:0;bottom:0;border-right:1px solid var(--bg)}
#bar .now{border:none;width:2px;background:var(--ink);z-index:2}
#ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}td{padding:5px 4px;border-top:1px solid var(--track)}
td.t{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.done{color:var(--done)}.over{color:var(--over)}.st{color:var(--ink2)}
</style></head><body>
<p class="sub" id="sub">loading…</p>
<p id="what"></p><p id="by"></p><p id="left"></p><p id="next"></p>
<div id="bar"></div><div id="ends"><span id="e0"></span><span id="e1"></span></div>
<table id="songs"></table>
<script>
// A fixed schedule: from a minute after the rehearsal starts to a minute before it ends (announcements), split over the
// checked sections by playing time. ?from=19:00&until=21:00 (or the status's pacing.from/until). The status is
// rehearsal_status.py's; see README.md.
const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const hm = t => { const d = new Date(t * 1000); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') };
// minutes left round down and minutes over round up, as the clock times shown are rounded down
const mins = s => { const m = s >= 0 ? Math.floor(s / 60) : Math.ceil(-s / 60); return m < 1 ? 'under a minute' : m === 1 ? '1 min' : m + ' min' };
let status = null, fetchedAt = 0;

// HH:MM as epoch seconds on the day of `ref` (the status's now), the end after the start
function at(s, ref) { const [h, m] = s.split(':').map(Number); const d = new Date(ref * 1000); d.setHours(h, m, 0, 0); return d.getTime() / 1000 }

function draw() {
  if (!status) return;
  const p = status.pacing || {sections: []}, secs = p.sections;
  const now = p.now + (Date.now() - fetchedAt) / 1000;
  const from = q.get('from') || p.from, until = q.get('until') || p.until;
  if (!from || !until) { $('sub').textContent = 'add ?from=19:00&until=21:00 to the address: the rehearsal\'s start and end'; return }
  let a = at(from, now), b = at(until, now);
  if (b <= a) b += 86400;
  if (now > b + 6 * 3600) { a += 86400; b += 86400 }          // tomorrow's rehearsal, after midnight
  if (a > now + 18 * 3600) { a -= 86400; b -= 86400 }        // tonight's, seen after midnight
  const t0 = a + 60, t1 = b - 60, total = secs.reduce((x, s) => x + s.play, 0);
  $('sub').textContent = `schedule ${hm(t0)} to ${hm(t1)} (rehearsal ${hm(a)} to ${hm(b)}), split by playing time · ` +
    `${secs.filter(s => s.done).length} of ${secs.length} sections done`;
  if (!secs.length || !total) { $('by').textContent = '—'; $('what').textContent = 'no song is tagged Today'; return }
  let cum = 0;
  for (const s of secs) { s.start = t0 + (t1 - t0) * cum / total; cum += s.play; s.by = t0 + (t1 - t0) * cum / total }
  const cur = secs.find(s => !s.done), nxt = cur && secs.slice(secs.indexOf(cur) + 1).find(s => !s.done);
  if (cur) {
    $('what').textContent = `${cur.song} · ${cur.section}` + (now < t0 ? ` · the schedule starts at ${hm(t0)}` : '');
    $('by').textContent = 'done by ' + hm(cur.by);
    const left = cur.by - now;
    $('left').textContent = left >= 0 ? `${mins(left)} left` : `${mins(left)} over`;
    $('left').className = left >= 0 ? 'ok' : 'over';
    $('next').textContent = nxt ? `then ${nxt.song === cur.song ? '' : nxt.song + ' · '}${nxt.section} by ${hm(nxt.by)}` : 'the last section';
  } else {
    const last = Math.max(...secs.map(s => s.done)), d = t1 - last;
    $('what').textContent = 'every section done';
    $('by').textContent = 'done ' + hm(last);
    $('left').textContent = d >= 0 ? `${mins(d)} early` : `${mins(d)} late`; $('left').className = d >= 0 ? 'ok' : 'over';
    $('next').textContent = '';
  }
  // the timeline: a block per section at its scheduled time, filled when done; songs alternate shades
  const x = t => Math.max(0, Math.min(100, (t - t0) / (t1 - t0) * 100));
  const bar = $('bar'); bar.innerHTML = '';
  let songIx = -1, lastSong = null;
  for (const s of secs) {
    if (s.song !== lastSong) { songIx++; lastSong = s.song }
    const d = document.createElement('div');
    d.style.left = x(s.start) + '%'; d.style.width = (x(s.by) - x(s.start)) + '%';
    d.style.background = s.done ? 'var(--done)' : s === cur ? 'var(--cur)' : songIx % 2 ? 'var(--seg2)' : 'var(--seg)';
    d.title = `${s.song} · ${s.section} by ${hm(s.by)}`;
    bar.appendChild(d);
  }
  if (now >= t0 && now <= t1) { const n = document.createElement('div'); n.className = 'now'; n.style.left = x(now) + '%'; bar.appendChild(n) }
  $('e0').textContent = hm(t0); $('e1').textContent = hm(t1);
  // a row per song: done by when, or when it was done and against its time
  const songs = [];
  for (const s of secs) { let g = songs.find(g => g.name === s.song); if (!g) songs.push(g = {name: s.song, secs: []}); g.secs.push(s) }
  $('songs').innerHTML = songs.map(g => {
    const left = g.secs.filter(s => !s.done), by = g.secs[g.secs.length - 1].by;
    if (!left.length) {
      const t = Math.max(...g.secs.map(s => s.done)), d = by - t;
      return `<tr><td>${esc(g.name)}</td><td class="st done">done ${hm(t)}</td><td class="t ${d >= 0 ? 'done' : 'over'}">${mins(d)} ${d >= 0 ? 'early' : 'late'}</td></tr>`;
    }
    return `<tr><td>${esc(g.name)}</td><td class="st">${left.length} of ${g.secs.length} sections left</td><td class="t">by ${hm(by)}</td></tr>`;
  }).join('');
}

async function tick() {
  try { status = await (await fetch('/status', {cache: 'no-store'})).json(); fetchedAt = Date.now(); draw() }
  catch (e) { $('sub').textContent = 'server not answering' }
}
tick(); setInterval(tick, 10000); setInterval(draw, 1000);
</script></body></html>
